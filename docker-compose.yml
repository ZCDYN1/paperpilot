# =============================================================================
# PaperPilot 多服务编排
# -----------------------------------------------------------------------------
# 用法：
#   cp .env.example .env          # 按需修改；不建 .env 也能起（默认走 mock 可跑通）
#   docker compose up --build
# 访问：
#   API 文档  http://localhost:8000/docs
#   健康检查  http://localhost:8000/healthz
#   Streamlit http://localhost:8501
# =============================================================================
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 默认装轻量镜像（不含 torch，约省 2GB+ 下载与数分钟构建）。
        # 想用本地 BGE embedding / 真 Reranker 的质量：
        #   docker compose build --build-arg INSTALL_LOCAL=true && docker compose up
        # 否则会拿到 EMBEDDING_PROVIDER=local 却缺 FlagEmbedding，启动时检索会明确报错。
        INSTALL_LOCAL: "false"
    image: paperpilot-api:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false          # 未创建 .env 时也能启动
    environment:
      # 容器内路径统一收敛到 /app/data，与下面的 volume 一一对应
      DATA_DIR: /app/data
      FAISS_INDEX_DIR: /app/data/faiss
      SQLITE_DIR: /app/data/sqlite
      CHECKPOINT_DB: /app/data/sqlite/checkpoints.db
      SQLITE_URL: sqlite+aiosqlite:////app/data/sqlite/paperpilot.db
      # ⚠️ 必须与 Dockerfile 里的 HF_HOME 保持一致，否则模型权重缓存不到挂载点
      HF_HOME: /app/.cache/huggingface
      # ---- 零 key 冷启动默认值 ----
      # `${VAR:-默认}` 由 compose 从宿主 .env（若存在）注入：
      # 配了就用你的，没配就退回 mock，保证「clone 下来直接 docker compose up」也能跑通全链路。
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
    command:
      # 先补齐离线样例语料（幂等：库里已有论文就原样跳过），再起服务。
      # 没有这一步，全新用户的 `data/` 是空的，第一次提问会直接去联网抓 arXiv。
      - sh
      - -c
      - python scripts/load_sample_data.py; exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - faiss_index:/app/data/faiss          # 向量索引
      - sqlite_data:/app/data/sqlite         # 元数据 + LangGraph checkpoint
      - hf_cache:/app/.cache/huggingface     # BGE 模型权重（~3GB，不挂则每次重下）
    healthcheck:
      # 用 python 而非 curl：slim 镜像里没有 curl
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s                     # 冷启动要加载模型/建索引，给足时间
    stop_grace_period: 30s                   # 让进行中的研究有机会落 checkpoint
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: paperpilot-ui:latest
    ports:
      - "8501:8501"
    environment:
      API_BASE: http://api:8000
    depends_on:
      api:
        condition: service_healthy           # 等 API 真正就绪，避免首个请求 502
    restart: unless-stopped

volumes:
  faiss_index:
  sqlite_data:
  hf_cache:
