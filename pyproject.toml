[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperpilot"
version = "0.1.0"
description = "基于 LangGraph 多 Agent 的 arXiv 论文深度研究工具：输入研究问题，输出中文、带可溯源引用的文献综述"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "PaperPilot Contributors" }]
keywords = ["rag", "langgraph", "multi-agent", "arxiv", "literature-review", "hybrid-retrieval"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 核心依赖：装完即可跑通「检索 → 抽取 → 校验 → 撰写」全链路
# （embedding/reranker 走 API 或 mock；要跑本地 BGE 再装 [local]）
dependencies = [
    # --- Web / API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # --- 配置 / 校验 ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # --- 编排 ---
    "langgraph>=0.2.45",
    "langgraph-checkpoint-sqlite>=2.0.1",
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-openai>=0.2.6",
    "langchain-community>=0.3.5",
    # 直连本机 Ollama 的官方集成。必须显式声明：
    # langchain-community 里的 Ollama 封装不支持 with_structured_output，
    # 只装了 community 的用户配 LLM_PROVIDER=ollama 会在第一个节点直接崩。
    "langchain-ollama>=0.2",
    # --- 检索 ---
    "faiss-cpu>=1.9.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26,<2.2",
    "jieba>=0.42.1",
    # --- 数据层 ---
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    # --- 容错 ---
    "tenacity>=9.0",
    # --- 抓取 ---
    "httpx>=0.27",
    "feedparser>=6.0.11",
    # --- 日志 ---
    "structlog>=24.4",
    # --- UI ---
    "streamlit>=1.40",
    "requests>=2.32",
]

[project.optional-dependencies]
# 本地 BGE embedding / reranker。不装也能跑（走 API 或 mock），但装了才有最好的检索质量。
# 注意：会拉 torch（约 2GB+），首次安装较慢。
local = [
    "FlagEmbedding>=1.3.2",
    "sentence-transformers>=3.3",
    "torch>=2.4",
    # reranker 直接 import 它来查本地权重缓存（`_cached_on_hf`），不靠传递依赖兜着
    "huggingface_hub>=0.23",
]
# RAGAS 评测。依赖较重，独立出来，主流程不强依赖。
eval = [
    "ragas>=0.2.6",
    "datasets>=3.1",
]
# LangSmith 追踪
tracing = [
    "langsmith>=0.1.140",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.urls]
Repository = "https://github.com/your-name/paperpilot"
Issues = "https://github.com/your-name/paperpilot/issues"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
