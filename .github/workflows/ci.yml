name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试与代码检查
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 只装核心 + dev：CI 里不装 torch（几百 MB 且本机测试用不到）
          pip install -e ".[dev]"

      - name: 代码检查（ruff）
        run: ruff check .

      - name: 单元测试
        # ⚠️ 全部走离线模式：
        #   - LLM/embedding/rerank 用 mock，不调用任何外部服务、不下载模型权重
        #   - INGEST_ENABLED=false 禁止联网抓 arXiv
        # 这样 CI 既快又稳，也不会因为 arXiv 限速或网络波动而"随机红"。
        env:
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock
          RERANK_PROVIDER: lexical
          INGEST_ENABLED: "false"
        run: pytest -q

      - name: API / SSE / 容错接线（离线专项）
        # 单独一步的理由：这一组用例盯的是**对外契约与工程化接线**
        # （SSE 事件类型、X-Accel-Buffering、HITL resume、输入侧注入防护、
        #   熔断真的包住 LLM 与 HTTP 出口、LANGCHAIN_* 真的同步进环境）。
        # 它们坏了不会让检索变差，只会让"承诺"变成空话 —— 所以要一条一眼能认出来的红。
        # 全部用 tmp sqlite + mock provider，零网络、零模型权重。
        env:
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock
          RERANK_PROVIDER: lexical
          INGEST_ENABLED: "false"
          MIN_CORPUS: "0"
        run: pytest -q tests/test_api_research.py tests/test_api_observability.py tests/test_resilience_wiring.py

      - name: 评测冒烟（离线 · 检索消融）
        # 只验证「评测链路本身」能跑通，不验证检索质量：
        #   - EMBEDDING_PROVIDER=mock + RERANK_PROVIDER=lexical：不下载模型、不联网、不需要任何 key；
        #   - 消融模块在索引为空时**也会退出 0**（只打印警告并产出一张空表），
        #     所以这一步不依赖预建索引 —— 这正是它能无网络跑通的原因。
        # 之所以要把它放进 CI：评测最容易「本地能跑、一进流水线就红」，
        # 把这条链路钉死在 mock 模式下，能让它长期可复现。
        env:
          EMBEDDING_PROVIDER: mock
          RERANK_PROVIDER: lexical
          INGEST_ENABLED: "false"
        run: |
          python -m app.eval.ablation --output eval_results/ablation_ci.md
          # 进一步确认：链路不只没崩，还真的产出了报告文件
          test -f eval_results/ablation_ci.md
          echo "✓ 评测冒烟通过：已产出 eval_results/ablation_ci.md"

  docker:
    name: 构建镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建 API 镜像（不含 torch，走 API embedding）
        # INSTALL_LOCAL=false 会跳过 torch/FlagEmbedding，
        # 镜像从 ~5GB 降到几百 MB，CI 上能跑得动。
        run: docker build --build-arg INSTALL_LOCAL=false -t paperpilot:ci .

      - name: 起容器并验证 /healthz
        run: |
          docker run -d --name paperpilot-ci -p 8000:8000 \
            -e LLM_PROVIDER=mock -e EMBEDDING_PROVIDER=mock \
            paperpilot:ci
          # 冷启动要建表 + 加载应用，给足重试次数
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz > /dev/null; then
              echo "✓ /healthz 就绪"
              health="$(curl -fsS http://localhost:8000/healthz)"
              echo "$health"
              # README 承诺的"熔断 / 追踪"必须在一个**刚 clone 起来**的容器里就看得见：
              # 这两个面板是"工程化项不是 PPT"的最省事核查点，缺了就说明接线又变成死代码。
              echo "$health" | grep -q '"resilience"' || { echo "✗ /healthz 未端出 resilience 面板"; docker logs paperpilot-ci; exit 1; }
              echo "$health" | grep -q '"tracing"' || { echo "✗ /healthz 未端出 tracing 面板"; docker logs paperpilot-ci; exit 1; }
              echo "✓ 熔断器与追踪状态已可见（resilience + tracing）"
              exit 0
            fi
            sleep 5
          done
          echo "✗ 容器未在预期时间内就绪"
          docker logs paperpilot-ci
          exit 1

  web:
    name: 前端检查与契约测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node（用于 web/）
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # npm ci 走 package-lock.json；缓存键锁在 web 的 lock 文件上
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装 Python 3.12（用于起后端跑契约测试）
        # 沿用 test job 同一套约定：3.12 + pip 缓存 + pip install -e ".[dev]"，
        # 只是这里只装核心 + dev（不装 torch），够起 mock 后端就行。
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 安装前端依赖（npm ci）
        working-directory: web
        run: npm ci

      - name: 类型检查（tsc --noEmit）
        working-directory: web
        run: npm run typecheck

      - name: 起后端（mock provider · 端口 8020）并等待 /healthz
        # 契约测试打的是真实后端，所以这里必须先有一个能应答的后端。
        # 端口用 8020 而非 8000：与 docker job / 本机习惯错开，避免端口占用。
        # 全离线：mock LLM/embedding、lexical rerank、禁联网抓 arXiv，CI 既快又稳。
        env:
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock
          RERANK_PROVIDER: lexical
          RERANK_ENABLED: "false"
          INGEST_ENABLED: "false"
          MIN_CORPUS: "0"
        run: |
          # 空库先灌样例语料（24 篇）：papers/chunks 靠它，CI 不联网。
          python scripts/load_sample_data.py --force
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8020 \
            > /tmp/uvicorn-8020.log 2>&1 &
          echo $! > /tmp/uvicorn-8020.pid
          # 冷启动要建表 + 加载应用，给足重试
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8020/healthz > /dev/null; then
              echo "OK: /healthz 就绪（第 $i 次探测）"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: 后端未在预期时间内就绪"
          cat /tmp/uvicorn-8020.log
          exit 1

      - name: 预跑一次完整研究，产出契约测试需要的真实 run 数据
        # contract.spec.ts 的 verification / token_by_node / citations 三条要读一条
        # **跑完 verify+finalize 的研究记录**；只灌样例语料（papers）不够 —— 本地实测
        # 会因 `verification 为空对象` 红。研究默认在 after_plan 处 HITL 中断
        # （confirm_outline=false，仅这一个中断点），所以 stream 一次 + resume 一次即可跑到终态。
        run: |
          cat > /tmp/stream_body.json <<'EOF'
          {"question":"RAG methods","filters":{"categories":["cs.CL"],"year_gte":2020,"year_lte":null,"has_code":null,"arxiv_ids":[]}}
          EOF
          # 跑到中断点为止，从 done 事件里取 run_id
          RESP="$(curl -sS -N -X POST http://127.0.0.1:8020/api/v1/research/stream \
            -H 'Content-Type: application/json' --data-binary @/tmp/stream_body.json)"
          RUN_ID="$(printf '%s' "$RESP" | grep -oE '\"run_id\": *\"[0-9a-f]+\"' | grep -oE '[0-9a-f]{16}' | tail -1)"
          echo "seed run_id=$RUN_ID"
          if [ -z "$RUN_ID" ]; then echo "FAIL: stream 未返回 run_id"; printf '%s\n' "$RESP" | tail -20; exit 1; fi
          # 沿用原拆解直接 resume，跑到 finalize
          curl -sS -N -X POST "http://127.0.0.1:8020/api/v1/research/$RUN_ID/resume" \
            -H 'Content-Type: application/json' --data-binary '{}' | tail -5
          # 轮询直到 status=completed 且带 verification（契约测试断言的非空对象）
          for i in $(seq 1 30); do
            ST="$(curl -sS "http://127.0.0.1:8020/api/v1/research/$RUN_ID" \
              | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("status"), bool(d.get("verification")))')"
            echo "poll $i: $ST"
            if printf '%s' "$ST" | grep -q '^completed True'; then echo "OK: 种子 run 已完成且带 verification"; exit 0; fi
            sleep 2
          done
          echo "FAIL: 种子 run 未在预期时间内完成"
          cat /tmp/uvicorn-8020.log
          exit 1

      - name: 契约测试（vitest · 打真实后端 · 禁止 skip）
        # CI=true 会触发 spec 里的开关：后端不可达时直接 fail 而非 skip。
        # 跑完再用 json reporter 复核：8 条必须全部执行、skipped 必须为 0，
        # 否则「后端没起来 → 全跳 → 绿」这种假保护就无从藏身。
        env:
          PAPERPILOT_API: http://127.0.0.1:8020
          CI: "true"
        working-directory: web
        run: |
          npm run test -- --reporter=default --reporter=json --outputFile=/tmp/contract.json
          echo "--- 复核：8 条契约测试必须全部执行、不允许 skip ---"
          node <<'EOF'
          const fs = require("fs");
          const j = JSON.parse(fs.readFileSync("/tmp/contract.json", "utf8"));
          const acc = [];
          (function walk(s) {
            for (const f of s || []) {
              for (const a of f.assertionResults || []) acc.push(a.status);
              if (f.testResults) walk(f.testResults);
            }
          })(j.testResults);
          const c = {};
          for (const s of acc) c[s] = (c[s] || 0) + 1;
          const skipped = (c.skipped || 0) + (c.pending || 0) + (c.todo || 0);
          const passed = c.passed || 0;
          console.log("contract 用例状态:", JSON.stringify(c));
          if (skipped > 0) {
            console.error("FAIL: 有 " + skipped + " 条契约测试被 skip —— CI 里必须真的执行。");
            process.exit(1);
          }
          if (passed < 8) {
            console.error("FAIL: 期望 8 条契约测试全部执行，passed=" + passed);
            process.exit(1);
          }
          console.log("OK: " + passed + " 条契约测试已执行，无 skip。");
          EOF
