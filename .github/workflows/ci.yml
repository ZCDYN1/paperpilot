name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试与代码检查
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 只装核心 + dev：CI 里不装 torch（几百 MB 且本机测试用不到）
          pip install -e ".[dev]"

      - name: 代码检查（ruff）
        run: ruff check .

      - name: 单元测试
        # ⚠️ 全部走离线模式：
        #   - LLM/embedding/rerank 用 mock，不调用任何外部服务、不下载模型权重
        #   - INGEST_ENABLED=false 禁止联网抓 arXiv
        # 这样 CI 既快又稳，也不会因为 arXiv 限速或网络波动而"随机红"。
        env:
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock
          RERANK_PROVIDER: lexical
          INGEST_ENABLED: "false"
        run: pytest -q

      - name: 评测冒烟（离线 · 检索消融）
        # 只验证「评测链路本身」能跑通，不验证检索质量：
        #   - EMBEDDING_PROVIDER=mock + RERANK_PROVIDER=lexical：不下载模型、不联网、不需要任何 key；
        #   - 消融模块在索引为空时**也会退出 0**（只打印警告并产出一张空表），
        #     所以这一步不依赖预建索引 —— 这正是它能无网络跑通的原因。
        # 之所以要把它放进 CI：评测最容易「本地能跑、一进流水线就红」，
        # 把这条链路钉死在 mock 模式下，能让它长期可复现。
        env:
          EMBEDDING_PROVIDER: mock
          RERANK_PROVIDER: lexical
          INGEST_ENABLED: "false"
        run: |
          python -m app.eval.ablation --output eval_results/ablation_ci.md
          # 进一步确认：链路不只没崩，还真的产出了报告文件
          test -f eval_results/ablation_ci.md
          echo "✓ 评测冒烟通过：已产出 eval_results/ablation_ci.md"

  docker:
    name: 构建镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建 API 镜像（不含 torch，走 API embedding）
        # INSTALL_LOCAL=false 会跳过 torch/FlagEmbedding，
        # 镜像从 ~5GB 降到几百 MB，CI 上能跑得动。
        run: docker build --build-arg INSTALL_LOCAL=false -t paperpilot:ci .

      - name: 起容器并验证 /healthz
        run: |
          docker run -d --name paperpilot-ci -p 8000:8000 \
            -e LLM_PROVIDER=mock -e EMBEDDING_PROVIDER=mock \
            paperpilot:ci
          # 冷启动要建表 + 加载应用，给足重试次数
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz > /dev/null; then
              echo "✓ /healthz 就绪"
              curl -s http://localhost:8000/healthz
              exit 0
            fi
            sleep 5
          done
          echo "✗ 容器未在预期时间内就绪"
          docker logs paperpilot-ci
          exit 1
